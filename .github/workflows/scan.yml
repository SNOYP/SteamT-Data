name: scan

on:
  schedule:
    - cron: "7,37 * * * *"    # запасной запуск, если цепочка вдруг оборвётся
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Scan Steam market
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SECONDS: "19200"
        run: python3 scan.py
      - name: Keep schedule alive
        if: always()
        run: |
          # GitHub отключает расписание в репозиториях без активности 60 дней — раз в неделю обновляем отметку
          if [ "$(date +%u)" = "1" ] && [ "$(date +%H)" -lt "6" ]; then
            date -u > heartbeat.txt
            git config user.name "steamt-bot"
            git config user.email "steamt-bot@users.noreply.github.com"
            git add heartbeat.txt && git commit -m "heartbeat" && git push || true
          fi
      - name: Start next run (continuous scan)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run scan.yml --repo "${{ github.repository }}" || true
